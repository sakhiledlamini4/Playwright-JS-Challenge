name: Restful Booker CI

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          path: Restful-Booker

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./Restful-Booker
        run: npm install

      - name: Run Playwright install
        working-directory: ./Restful-Booker
        run: npx playwright install --with-deps

      - name: Run tests
        working-directory: ./Restful-Booker
        run: npx playwright test

      - name: Generate Playwright report
        working-directory: ./Restful-Booker
        run: npx playwright show-report

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-restful-booker
          path: Restful-Booker/playwright-report/
          retention-days: 30