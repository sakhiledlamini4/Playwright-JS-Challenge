name: Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run'
        required: true
        type: choice
        options:
          - restful-booker
          - sauce-demo

jobs:
  run-restful-booker-tests:
    uses: Restful Booker/.github/workflows/restful-booker.yml@main

  run-sauce-demo-tests:
    uses: Sauce Demo/.github/workflows/sauce-demo.yml@main

  run-project-workflow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Determine Project to Run
        id: project
        run: |
          echo "::set-output name=project::${{ github.event.inputs.project }}"
    outputs:
      project: ${{ steps.project.outputs.project }}
    # Dynamically call the correct workflow based on input
  run-restful-booker-dispatch:
    if: needs.run-project-workflow.outputs.project == 'restful-booker'
    needs: run-project-workflow
    uses: Restful Booker/.github/workflows/restful-booker.yml@main

  run-sauce-demo-dispatch:
    if: needs.run-project-workflow.outputs.project == 'sauce-demo'
    needs: run-project-workflow
    uses: Sauce Demo/.github/workflows/sauce-demo.yml@main