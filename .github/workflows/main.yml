name: Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run'
        required: true
        type: choice
        options:
          - restful-booker
          - sauce-demo

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies for Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'restful-booker'
        working-directory: ./Restful-Booker
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests for Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'restful-booker'
        working-directory: ./Restful-Booker
        run: |
          npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ./Restful-Booker/playwright-report/
            ./Sauce-Demo/playwright-report/
          retention-days: 30