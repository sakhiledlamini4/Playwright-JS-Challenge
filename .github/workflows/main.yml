name: Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run'
        required: true
        type: choice
        options:
          - restful-booker
          - sauce-demo
          - k6-restful-booker

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Restful-Booker setup and test run
      - name: Install dependencies for Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'restful-booker'
        working-directory: ./Restful-Booker
        run: |
          npm ci --include=dev
          npx playwright install --with-deps

      - name: Run Playwright tests for Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'restful-booker'
        working-directory: ./Restful-Booker
        run: |
          npx playwright test

      - name: Upload Monocart Report for Restful Booker
        if: always() && (github.event_name == 'push' || github.event.inputs.project == 'restful-booker')
        uses: actions/upload-artifact@v4
        with:
          name: monocart-report-restful-booker
          path: ./Restful-Booker/monocart-report/
          retention-days: 30

      # K6-Restful-Booker setup and test run
      - name: Install k6
        if: github.event_name == 'push' || github.event.inputs.project == 'k6-restful-booker'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2 software-properties-common curl
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Install dependencies for K6 Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'k6-restful-booker'
        working-directory: ./K6-Restful-Booker
        run: |
          npm ci --include=dev

      - name: Run K6 tests for K6 Restful Booker
        if: github.event_name == 'push' || github.event.inputs.project == 'k6-restful-booker'
        working-directory: ./K6-Restful-Booker
        run: |
          npm run perf
          npm run report

      - name: Upload K6 summary report
        if: always() && (github.event_name == 'push' || github.event.inputs.project == 'k6-restful-booker')
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-report
          path: |
            ./K6-Restful-Booker/summary.json
            ./K6-Restful-Booker/k6-report/report.html
          retention-days: 30

      # Sauce-Demo setup and test run
      - name: Install dependencies for Sauce Demo
        if: github.event_name == 'push' || github.event.inputs.project == 'sauce-demo'
        working-directory: ./Sauce-Demo
        run: |
          npm ci --include=dev
          npx playwright install --with-deps

      - name: Run Playwright tests for Sauce Demo
        if: github.event_name == 'push' || github.event.inputs.project == 'sauce-demo'
        working-directory: ./Sauce-Demo
        run: |
          npx playwright test

      - name: Upload Monocart Report for Sauce Demo
        if: always() && (github.event_name == 'push' || github.event.inputs.project == 'sauce-demo')
        uses: actions/upload-artifact@v4
        with:
          name: monocart-report-sauce-demo
          path: ./Sauce-Demo/monocart-report/
          retention-days: 30
