name: Multi-Project CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to run'
        required: true
        type: choice
        options:
          - restful-booker
          - sauce-demo

jobs:
  run-restful-booker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Call Restful Booker Workflow
        uses: ./.github/workflows/restful-booker.yml

  run-sauce-demo-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sauce Demo Workflow
        uses: ./.github/workflows/sauce-demo.yml

  run-project-workflow:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Determine Project to Run
        id: project
        run: |
          echo "::set-output name=project::${{ github.event.inputs.project }}"
      - name: Call Restful Booker Workflow
        if: steps.project.outputs.project == 'restful-booker'
        uses: ./.github/workflows/restful-booker.yml
      - name: Call Sauce Demo Workflow
        if: steps.project.outputs.project == 'sauce-demo'
        uses: ./.github/workflows/sauce-demo.yml